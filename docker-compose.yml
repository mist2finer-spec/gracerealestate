# Optional docker-compose for local production testing
# Usage:
#   docker compose up --build
# Then open http://localhost:3000
version: "3.9"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      # Override these in .env.docker or pass via --env-file
      - NODE_ENV=production
      - DATABASE_URL=file:./data/prod.db
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?Set ADMIN_PASSWORD before starting}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-change-me-in-production}
      - NEXTAUTH_URL=http://localhost:3000
    volumes:
      # Persist SQLite DB across restarts
      - site_data:/app/data
    restart: unless-stopped

volumes:
  site_data:
