# Optional docker-compose for self-hosting / local production testing.
# Usage:
#   ADMIN_PASSWORD=... docker compose up --build -d
#   # create the tables once (from the repo, with Node installed):
#   DATABASE_URL=postgresql://grace:grace@localhost:5432/grace npx prisma migrate deploy
# Then open http://localhost:3000

services:
  db:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=grace
      - POSTGRES_PASSWORD=grace
      - POSTGRES_DB=grace
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - db
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://grace:grace@db:5432/grace
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?Set ADMIN_PASSWORD before starting}
    restart: unless-stopped

volumes:
  db_data:
