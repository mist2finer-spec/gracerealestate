# =====================================================
# Grace Choi Real Estate CI — lint, type-check, and build on every push/PR
# =====================================================
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel superseded runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v5

      - name: 📦 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 📥 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🧹 Lint
        run: bun run lint

      - name: 🔍 Type-check
        run: bunx tsc --noEmit

      - name: 🏗️ Build
        run: bun run build
        env:
          # Provide a dummy DATABASE_URL so Prisma client generation works
          DATABASE_URL: "file:./ci.db"
          NEXT_TELEMETRY_DISABLED: "1"

      - name: 📦 Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-standalone
          path: |
            .next/standalone
            .next/static
            public
          retention-days: 7
