# =====================================================
# Auto-deploy to Vercel on push to main
# Requires VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
# as GitHub Actions secrets (set in repo settings).
# =====================================================
name: Deploy to Vercel

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: vercel-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v5

      - name: 🔐 Check required secrets
        id: check_secrets
        # GitHub Actions doesn't allow secrets.* inside job-level if,
        # so we check here at step level and skip subsequent steps gracefully
        # if VERCEL_TOKEN isn't configured yet.
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "::notice::VERCEL_TOKEN secret not set — skipping deploy."
            echo "::notice::Set VERCEL_TOKEN in repo Settings → Secrets → Actions to enable auto-deploy."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "✓ VERCEL_TOKEN is configured — proceeding with deploy."
          fi

      - name: 📦 Setup Bun
        if: steps.check_secrets.outputs.skip != 'true'
        uses: oven-sh/setup-bun@v2

      - name: 📥 Install
        if: steps.check_secrets.outputs.skip != 'true'
        run: bun install --frozen-lockfile

      - name: 🧹 Lint
        if: steps.check_secrets.outputs.skip != 'true'
        run: bun run lint

      - name: 🚀 Install Vercel CLI
        if: steps.check_secrets.outputs.skip != 'true'
        run: bun add -g vercel

      - name: 🔗 Link project (if not linked)
        if: steps.check_secrets.outputs.skip != 'true'
        run: |
          if [ ! -f .vercel/project.json ]; then
            vercel link --yes --token=${{ secrets.VERCEL_TOKEN }}
          fi

      - name: 🏗️ Build with Vercel
        if: steps.check_secrets.outputs.skip != 'true'
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          ESTATA_ADMIN_PASSWORD: ${{ secrets.ESTATA_ADMIN_PASSWORD }}
          NEXT_TELEMETRY_DISABLED: "1"

      - name: 🚀 Deploy to production
        if: steps.check_secrets.outputs.skip != 'true'
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
